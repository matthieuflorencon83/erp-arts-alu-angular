# =============================================================================
# ANTIGRAVITY ERP - Docker Compose
# Stack: MySQL 8.0 + Adminer + Redis
# Usage: docker-compose up -d
# =============================================================================

name: antigravity-erp

services:
  # ===========================================================================
  # MySQL 8.0 - Base de données principale
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: antigravity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-antigravity_root}
      MYSQL_DATABASE: ${DB_NAME:-erp_arts_alu}
      MYSQL_USER: ${DB_USER:-erp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antigravity-network

  # ===========================================================================
  # Adminer - Interface Web pour MySQL
  # Access: http://localhost:8080
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: antigravity-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: nette
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - antigravity-network

  # ===========================================================================
  # Redis - Cache et Files d'attente (Bull, Celery)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: antigravity-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antigravity-network

  # ===========================================================================
  # Node.js Backend (Production-ready)
  # Uncomment to run Node in Docker
  # ===========================================================================
  # backend-node:
  #   build:
  #     context: ./backend-node
  #     dockerfile: Dockerfile
  #   container_name: antigravity-node
  #   restart: unless-stopped
  #   ports:
  #     - "${NODE_PORT:-3000}:3000"
  #   environment:
  #     - NODE_ENV=development
  #     - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend-node:/app
  #     - /app/node_modules
  #   networks:
  #     - antigravity-network

  # ===========================================================================
  # Python Service (FastAPI pour IA/Calculs)
  # Uncomment to run Python in Docker
  # ===========================================================================
  # backend-python:
  #   build:
  #     context: ./backend-python
  #     dockerfile: Dockerfile
  #   container_name: antigravity-python
  #   restart: unless-stopped
  #   ports:
  #     - "${PYTHON_PORT:-8000}:8000"
  #   environment:
  #     - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend-python:/app
  #   networks:
  #     - antigravity-network

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  mysql_data:
    name: antigravity-mysql-data
  redis_data:
    name: antigravity-redis-data

# =============================================================================
# Réseau interne
# =============================================================================
networks:
  antigravity-network:
    name: antigravity-network
    driver: bridge
